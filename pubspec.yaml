name: resto_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.1

  http: ^1.2.0
  rename: ^3.1.0
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.3
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.5.1
  build_runner: ^2.8.0

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Vollkorn
      fonts:
        - asset: assets/fonts/Vollkorn-Black.ttf
          weight: 900
        - asset: assets/fonts/Vollkorn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vollkorn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vollkorn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vollkorn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vollkorn-Regular.ttf
          weight: 400
